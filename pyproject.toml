[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "messenger-analyzer"
dynamic = ["version"]
description = "Statistics and charts for Facebook Messenger chat exports"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Elias Kordoulas" }]
requires-python = ">=3.10"
dependencies = [
    "polars>=1.30",
    "orjson>=3.10",
    "tzlocal>=5.0",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Environment :: Console",
    "Topic :: Communications :: Chat",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.8"]

[dependency-groups]
dev = [
    "matplotlib>=3.8",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
msganalyzer = "messenger_analyzer.cli:main"

[tool.hatch.version]
path = "src/messenger_analyzer/__init__.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["messenger_analyzer"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL", "C4", "PT"]
ignore = ["PLR0913", "PLR2004", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR0915", "PLC0415"]
"src/messenger_analyzer/cli.py" = ["PLC0415"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = false
files = ["src"]

[[tool.mypy.overrides]]
module = ["tzlocal", "matplotlib.*"]
ignore_missing_imports = true
