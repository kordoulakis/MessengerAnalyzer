[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "nostos"
dynamic = ["version"]
description = "Look back on your conversations: statistics and interactive charts from chat exports"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Elias Kordoulas" }]
requires-python = ">=3.10"
dependencies = [
    "polars>=1.30",
    "orjson>=3.10",
    "tzlocal>=5.0",
    "plotly>=6.1",
]

[project.optional-dependencies]
# Saving charts as PNG/SVG/PDF; also needs Chrome or Chromium.
export = ["kaleido>=1.0"]

[dependency-groups]
dev = [
    "kaleido>=1.0",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
nostos = "nostos.cli:main"

[tool.hatch.version]
path = "src/nostos/__init__.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["nostos"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL", "C4", "PT"]
ignore = ["PLR0913", "PLR2004", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR0915", "PLC0415"]
"src/nostos/cli.py" = ["PLC0415"]
"src/nostos/charts/html.py" = ["E501", "PLC0415"]  # embedded CSS
"src/nostos/charts/figures.py" = ["E501"]  # chart registry descriptions

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = false
files = ["src"]

[[tool.mypy.overrides]]
module = ["tzlocal", "plotly.*", "kaleido.*"]
ignore_missing_imports = true
